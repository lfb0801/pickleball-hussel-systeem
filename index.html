<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hussel — Pickleball Den Bosch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Figtree:wght@700;900&display=swap">
<link rel="stylesheet" href="thema.css?v=202610202154">
<link rel="stylesheet" href="stijl.css?v=202610202154">
</head>
<body>
<header class="balk">
  <div class="merk">
    <span class="bal" aria-hidden="true"></span>
    <span class="merk-tekst"><strong data-t="app"></strong><small data-t="club"></small></span>
  </div>
  <nav>
    <button type="button" data-scherm="spelers" data-t="nav_spelers"></button>
    <button type="button" data-scherm="avond" data-t="nav_avond"></button>
  </nav>
  <div class="balk-rechts">
    <span id="telefoon-status" class="pil pil-donker" hidden></span>
    <button type="button" id="volledig-scherm" class="knop-icoon" data-t-title="volledig_scherm" aria-label="Volledig scherm">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</header>
<div id="melding" class="melding" hidden>
  <p id="melding-tekst"></p>
  <button type="button" id="melding-sluit" class="knop-link" data-t="sluiten"></button>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<main>
  <section id="scherm-spelers" hidden>
    <div class="kolommen">
      <div class="kaart smal">
        <h2 data-t="groepen_titel"></h2>
        <p class="uitleg" data-t="groepen_uitleg"></p>
        <ol id="groepen-lijst" class="groepen"></ol>
        <form id="groep-toevoegen" class="regel">
          <input type="text" id="groep-naam" data-t-placeholder="groep_naam" required>
          <button type="submit" class="knop" data-t="groep_toevoegen"></button>
        </form>
      </div>

      <div class="kaart breed">
        <div class="kaart-kop">
          <h2 data-t="spelerslijst_titel"></h2>
          <span id="spelers-aantal" class="pil"></span>
          <input type="search" id="spelers-zoek" class="zoek" data-t-placeholder="zoeken">
        </div>
        <form id="speler-toevoegen" class="regel">
          <input type="text" id="nieuwe-speler-naam" data-t-placeholder="speler_naam" required>
          <select id="nieuwe-speler-groep"></select>
          <button type="submit" class="knop knop-primair" data-t="speler_toevoegen"></button>
        </form>
        <div class="tabel-houder">
          <table id="spelers-tabel">
            <thead><tr><th data-t="kolom_naam"></th><th data-t="kolom_groep"></th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <p id="spelers-leeg" class="leeg" hidden></p>

      </div>
    </div>
  </section>

  <section id="scherm-avond" hidden>
    <div class="kolommen">
      <div class="kaart breed">
        <div class="kaart-kop">
          <h2 data-t="aanwezig_titel"></h2>
          <input type="search" id="avond-zoek" class="zoek" data-t-placeholder="zoeken">
          <label class="schakel-label"><input type="checkbox" id="alleen-aanwezig"> <span data-t="alleen_aanwezig"></span></label>
        </div>
        <p class="uitleg" data-t="aanwezig_uitleg"></p>
        <div id="aanwezigheid"></div>
      </div>

      <aside class="zijkolom">

        <div class="kaart">
          <h2 id="avond-kop"></h2>
          <div class="banen-keuze">
            <span data-t="banen"></span>
            <div class="stapper">
              <button type="button" id="banen-min" class="knop-rond" aria-label="Minder banen">−</button>
              <output id="aantal-banen">4</output>
              <button type="button" id="banen-plus" class="knop-rond" aria-label="Meer banen">+</button>
            </div>
          </div>
          <p id="avond-teller" class="teller"></p>
          <h3 data-t="preset_titel"></h3>
          <div id="presets" class="presets"></div>
          <p class="knoppen">
            <button type="button" id="start-avond" class="knop knop-primair knop-groot" data-t="avond_starten"></button>
          </p>
          <p class="uitleg" data-t="avond_starten_uitleg"></p>
        </div>

      </aside>
    </div>
  </section>

  <section id="scherm-ronde" hidden>
    <div class="ronde-kop">
      <h1><span data-t="ronde_titel"></span> <span id="ronde-nummer"></span></h1>
      <span id="ronde-status" class="pil"></span>
      <div class="acties">
        <button type="button" id="opnieuw-loten" class="knop" data-t="opnieuw_loten"></button>
        <button type="button" id="start-ronde" class="knop knop-primair knop-groot"></button>
        <button type="button" id="volgende-ronde" class="knop knop-primair knop-groot" data-t="volgende_voorbereiden"></button>
        <button type="button" id="open-paneel" class="knop knop-paneel"><span data-t="paneel_knop"></span> <span id="paneel-knop-aantal" class="pil"></span></button>
      </div>
    </div>
    <p id="concept-uitleg" class="uitleg"></p>
    <div id="lobby" class="lobby" hidden>
      <div class="kaart aansluiten lobby-qr">
        <h2 data-t="lobby_titel"></h2>
        <div class="qr" id="qr-lobby"></div>
        <p class="sessiecode"><span data-t="sessiecode"></span> <strong id="code-lobby"></strong></p>
        <p class="uitleg" data-t="lobby_uitleg"></p>
      </div>
      <div class="kaart lobby-lijst">
        <div class="kaart-kop"><h2 data-t="lobby_binnen"></h2><span id="lobby-aantal" class="pil pil-bezig"></span></div>
        <p id="lobby-hint" class="uitleg"></p>
        <div id="lobby-spelers"></div>
      </div>
    </div>
    <div id="verouderd" class="kaart verouderd" hidden></div>
    <div class="ronde-lijf">
      <div id="banen" class="banen"></div>
      <aside id="ronde-zij" class="kaart aansluiten mini" hidden>
        <div class="qr" id="qr-klein"></div>
        <p class="sessiecode"><strong id="code-klein"></strong></p>
        <p class="uitleg" data-t="aansluiten_kort"></p>
      </aside>
    </div>
    <div id="rustbalk" class="rustbalk"></div>
  </section>

</main>

<div id="paneel-achtergrond" class="paneel-achtergrond" hidden></div>
<aside id="paneel" class="paneel" hidden aria-labelledby="paneel-titel">
  <header class="paneel-kop">
    <h2 id="paneel-titel" data-t="paneel_titel"></h2>
    <button type="button" id="paneel-sluit" class="knop-rond" aria-label="Sluiten">×</button>
  </header>
  <div class="paneel-inhoud">
    <div id="paneel-overzicht">
      <section class="paneel-sectie paneel-knoppen">
        <button type="button" id="naar-kiezen" class="knop knop-primair" data-t="paneel_kiezen_knop"></button>
        <button type="button" id="naar-nieuw" class="knop" data-t="paneel_nieuw_knop"></button>
      </section>
      <section class="paneel-sectie">
        <h3 data-t="paneel_avond"></h3>
        <div class="instelling">
          <span data-t="banen"></span>
          <div class="stapper">
            <button type="button" id="ronde-banen-min" class="knop-rond" aria-label="Minder banen">−</button>
            <output id="ronde-banen">4</output>
            <button type="button" id="ronde-banen-plus" class="knop-rond" aria-label="Meer banen">+</button>
          </div>
        </div>
        <label class="instelling">
          <span data-t="modus"></span>
          <select id="ronde-modus"></select>
        </label>
        <p id="modus-uitleg" class="uitleg"></p>
      </section>
      <section class="paneel-sectie">
        <div class="paneel-sectiekop"><h3 data-t="paneel_vanavond"></h3><span id="paneel-aantal" class="pil pil-bezig"></span></div>
        <div id="paneel-aanwezig"></div>
      </section>
      <section class="paneel-sectie">
        <p id="paneel-verbinding" class="uitleg"></p>
        <p id="lokaal-waarschuwing" class="uitleg waarschuwing-tekst" hidden data-t="lokaal_bestand"></p>
        <button type="button" id="stop-avond" class="knop knop-gevaar" data-t="avond_afsluiten"></button>
      </section>
    </div>

    <div id="paneel-kiezen" hidden>
      <button type="button" class="knop-link paneel-terug" data-t="terug"></button>
      <h3 data-t="paneel_kiezen_titel"></h3>
      <p class="uitleg" data-t="paneel_kiezen_uitleg"></p>
      <input type="search" id="paneel-zoek" class="zoek" data-t-placeholder="paneel_zoek">
      <div id="paneel-afwezig" class="paneel-afwezig"></div>
      <div class="paneel-voet">
        <button type="button" id="kiezen-bevestig" class="knop knop-primair knop-groot"></button>
      </div>
    </div>

    <div id="paneel-nieuw-weergave" hidden>
      <button type="button" class="knop-link paneel-terug" data-t="terug"></button>
      <h3 data-t="paneel_nieuw_knop"></h3>
      <p class="uitleg" data-t="paneel_nieuw_uitleg"></p>
      <form id="paneel-nieuw" class="kolom">
        <input type="text" id="paneel-nieuw-naam" maxlength="40" data-t-placeholder="paneel_nieuw" required>
        <select id="paneel-nieuw-groep"></select>
        <button type="submit" class="knop knop-primair" data-t="speler_toevoegen"></button>
      </form>
      <ul id="paneel-toegevoegd" class="paneel-toegevoegd"></ul>
    </div>
  </div>
</aside>
<script src="teksten.js?v=202610202154"></script>
<script src="peerjs.min.js?v=202610202154"></script>
<script src="qrcode.js?v=202610202154"></script>
<script src="hussel.js?v=202610202154"></script>
<script src="presets.js?v=202610202154"></script>
<script src="sessie.js?v=202610202154"></script>
<script src="verbinding.js?v=202610202154"></script>
<script src="opslag.js?v=202610202154"></script>
<script src="scherm-spelers.js?v=202610202154"></script>
<script src="scherm-avond.js?v=202610202154"></script>
<script src="scherm-ronde.js?v=202610202154"></script>
<script src="scherm-paneel.js?v=202610202154"></script>
<script src="app.js?v=202610202154"></script>
</body>
</html>
