<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="title_host">Hussel — Pickleball Den Bosch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Figtree:wght@700;900&display=swap">
<link rel="stylesheet" href="assets/css/theme.css?v=20261022170120">
<link rel="stylesheet" href="assets/css/style.css?v=20261022170120">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="ball" aria-hidden="true"></span>
    <span class="brand-text"><strong data-t="app"></strong><small data-t="club"></small></span>
  </div>
  <nav>
    <button type="button" data-screen="players" data-t="nav_players"></button>
    <button type="button" data-screen="evening" data-t="nav_evening"></button>
  </nav>
  <div class="topbar-right">
    <span id="phone-status" class="pill pill-dark" hidden></span>
    <div id="language-switch"></div>
    <button type="button" id="fullscreen" class="btn-icon" data-t-title="fullscreen" data-t-aria-label="fullscreen">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</header>
<div id="notice" class="notice" hidden>
  <p id="notice-text"></p>
  <button type="button" id="notice-close" class="btn-link" data-t="close"></button>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="scan-notice" class="scan-notice" role="status" aria-live="polite" hidden></div>
<!-- The camera picture is never shown: the scanner only reads its frames. -->
<video id="scanner-video" class="scanner-video" muted playsinline aria-hidden="true"></video>
<dialog id="confirm" class="confirm" aria-labelledby="confirm-text">
  <p id="confirm-text"></p>
  <p class="buttons">
    <button type="button" id="confirm-no" class="btn" data-t="cancel"></button>
    <button type="button" id="confirm-yes" class="btn btn-primary"></button>
  </p>
</dialog>

<dialog id="scan-level" class="confirm" aria-labelledby="scan-level-text">
  <p id="scan-level-text"></p>
  <div id="scan-level-choice" class="scan-levels"></div>
  <p class="buttons">
    <button type="button" id="scan-level-cancel" class="btn" data-t="cancel"></button>
  </p>
</dialog>

<main>
  <section id="screen-players" hidden>
    <div class="columns">
      <div class="card narrow">
        <h2 data-t="groups_title"></h2>
        <p class="hint" data-t="groups_help"></p>
        <ol id="group-list" class="groups"></ol>
        <form id="add-group" class="inline-form">
          <input type="text" id="new-group-name" data-t-placeholder="group_name" required>
          <button type="submit" class="btn" data-t="add_group"></button>
        </form>
      </div>

      <div class="card wide">
        <div class="card-header">
          <h2 data-t="player_list_title"></h2>
          <span id="player-count" class="pill"></span>
          <input type="search" id="players-search" class="search" data-t-placeholder="search">
        </div>
        <form id="add-player" class="inline-form">
          <input type="text" id="new-player-name" data-t-placeholder="player_name" required>
          <select id="new-player-group"></select>
          <button type="submit" class="btn btn-primary" data-t="add_player"></button>
        </form>
        <div class="table-wrap">
          <table id="players-table">
            <thead><tr><th data-t="column_name"></th><th data-t="column_group"></th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <p id="players-empty" class="empty" hidden></p>

      </div>
    </div>
  </section>

  <section id="screen-evening" hidden>
    <div class="columns">
      <div class="card wide">
        <div class="card-header">
          <h2 data-t="attendance_title"></h2>
          <input type="search" id="evening-search" class="search" data-t-placeholder="search">
          <label class="toggle-label"><input type="checkbox" id="only-present"> <span data-t="only_present"></span></label>
        </div>
        <p class="hint" data-t="attendance_help"></p>
        <div id="attendance"></div>
      </div>

      <aside class="side-column">

        <div class="card">
          <h2 id="evening-heading"></h2>
          <div class="courts-picker">
            <span data-t="courts"></span>
            <div class="stepper">
              <button type="button" id="courts-minus" class="btn-round" data-t-aria-label="fewer_courts">−</button>
              <output id="court-count">4</output>
              <button type="button" id="courts-plus" class="btn-round" data-t-aria-label="more_courts">+</button>
            </div>
          </div>
          <p id="evening-counter" class="counter"></p>
          <h3 data-t="preset_title"></h3>
          <div id="presets" class="presets"></div>
          <p class="buttons">
            <button type="button" id="start-evening" class="btn btn-primary btn-large" data-t="start_evening"></button>
          </p>
          <p class="hint" data-t="start_evening_help"></p>
        </div>

      </aside>
    </div>
  </section>

  <section id="screen-round" hidden>
    <div class="round-header">
      <h1><span data-t="round_title"></span> <span id="round-number"></span></h1>
      <span id="round-status" class="pill"></span>
      <div class="actions">
        <button type="button" id="redraw" class="btn" data-t="redraw"></button>
        <button type="button" id="start-round" class="btn btn-primary btn-large"></button>
        <button type="button" id="next-round" class="btn btn-primary btn-large" data-t="prepare_next"></button>
        <button type="button" id="open-panel" class="btn btn-panel"><span data-t="panel_button"></span> <span id="panel-button-count" class="pill"></span></button>
      </div>
    </div>
    <p id="draft-hint" class="hint"></p>
    <div id="lobby" class="lobby" hidden>
      <div class="card join lobby-qr">
        <h2 data-t="lobby_title"></h2>
        <div class="qr" id="qr-lobby"></div>
        <p class="session-code"><span data-t="session_code"></span> <strong id="lobby-code"></strong></p>
        <p class="hint" data-t="lobby_help"></p>
        <div id="scanner-slot-lobby" class="scanner-slot">
          <div id="scanner" class="scanner">
            <p id="scanner-on" class="scanner-on" hidden><span class="scanner-dot" aria-hidden="true"></span> <span data-t="scanner_help"></span></p>
            <p id="scanner-message" class="hint warning-text" hidden></p>
            <button type="button" id="scanner-toggle" class="btn btn-small"></button>
          </div>
        </div>
      </div>
      <div class="card lobby-list">
        <div class="card-header"><h2 data-t="lobby_joined"></h2><span id="lobby-count" class="pill pill-running"></span></div>
        <p id="lobby-hint" class="hint"></p>
        <div id="lobby-players"></div>
      </div>
    </div>
    <div id="stale" class="card stale" hidden></div>
    <div class="round-body">
      <div id="courts" class="courts"></div>
      <aside id="round-side" class="card join mini" hidden>
        <div class="qr" id="qr-small"></div>
        <p class="session-code"><strong id="code-small"></strong></p>
        <p class="hint" data-t="join_short"></p>
        <div id="scanner-slot-round" class="scanner-slot"></div>
      </aside>
    </div>
    <div id="rest-bar" class="rest-bar"></div>
  </section>

</main>

<div id="panel-backdrop" class="panel-backdrop" hidden></div>
<aside id="panel" class="panel" hidden aria-labelledby="panel-title">
  <header class="panel-header">
    <h2 id="panel-title" data-t="panel_title"></h2>
    <button type="button" id="panel-close" class="btn-round" data-t-aria-label="close">×</button>
  </header>
  <div class="panel-content">
    <div id="panel-overview">
      <section class="panel-section panel-buttons">
        <button type="button" id="to-pick" class="btn btn-primary" data-t="panel_pick_button"></button>
        <button type="button" id="to-new" class="btn" data-t="panel_new_button"></button>
      </section>
      <section class="panel-section">
        <h3 data-t="panel_evening"></h3>
        <div class="setting">
          <span data-t="courts"></span>
          <div class="stepper">
            <button type="button" id="round-courts-minus" class="btn-round" data-t-aria-label="fewer_courts">−</button>
            <output id="round-courts">4</output>
            <button type="button" id="round-courts-plus" class="btn-round" data-t-aria-label="more_courts">+</button>
          </div>
        </div>
        <label class="setting">
          <span data-t="mode"></span>
          <select id="round-mode"></select>
        </label>
        <p id="mode-hint" class="hint"></p>
      </section>
      <section class="panel-section">
        <div class="panel-section-header"><h3 data-t="panel_present"></h3><span id="panel-count" class="pill pill-running"></span></div>
        <div id="panel-present"></div>
      </section>
      <section class="panel-section">
        <p id="panel-connection" class="hint"></p>
        <p id="local-warning" class="hint warning-text" hidden data-t="local_file"></p>
        <button type="button" id="stop-evening" class="btn btn-danger" data-t="end_evening"></button>
      </section>
    </div>

    <div id="panel-pick" hidden>
      <button type="button" class="btn-link panel-back" data-t="back"></button>
      <h3 data-t="panel_pick_title"></h3>
      <p class="hint" data-t="panel_pick_help"></p>
      <input type="search" id="panel-search" class="search" data-t-placeholder="panel_search">
      <div id="panel-absent" class="panel-absent"></div>
      <div class="panel-footer">
        <button type="button" id="pick-confirm" class="btn btn-primary btn-large"></button>
      </div>
    </div>

    <div id="panel-new-view" hidden>
      <button type="button" class="btn-link panel-back" data-t="back"></button>
      <h3 data-t="panel_new_button"></h3>
      <p class="hint" data-t="panel_new_help"></p>
      <form id="panel-new" class="stack">
        <input type="text" id="panel-new-name" maxlength="40" data-t-placeholder="panel_new_name" required>
        <select id="panel-new-group"></select>
        <button type="submit" class="btn btn-primary" data-t="add_player"></button>
      </form>
      <ul id="panel-added" class="panel-added"></ul>
    </div>
  </div>
</aside>
<script src="assets/js/core/locales/nl.js?v=20261022170120"></script>
<script src="assets/js/core/locales/en.js?v=20261022170120"></script>
<script src="assets/js/core/i18n.js?v=20261022170120"></script>
<script src="assets/vendor/peerjs.min.js?v=20261022170120"></script>
<script src="assets/vendor/qrcode.js?v=20261022170120"></script>
<script src="assets/vendor/jsqr.js?v=20261022170120"></script>
<script src="assets/js/core/pairing.js?v=20261022170120"></script>
<script src="assets/js/core/presets.js?v=20261022170120"></script>
<script src="assets/js/core/session.js?v=20261022170120"></script>
<script src="assets/js/core/network.js?v=20261022170120"></script>
<script src="assets/js/core/migrate.js?v=20261022170120"></script>
<script src="assets/js/core/pass.js?v=20261022170120"></script>
<script src="assets/js/core/store.js?v=20261022170120"></script>
<script src="assets/js/core/offline.js?v=20261022170120"></script>
<script src="assets/js/laptop/players-screen.js?v=20261022170120"></script>
<script src="assets/js/laptop/evening-screen.js?v=20261022170120"></script>
<script src="assets/js/laptop/round-screen.js?v=20261022170120"></script>
<script src="assets/js/laptop/side-panel.js?v=20261022170120"></script>
<script src="assets/js/laptop/scanner.js?v=20261022170120"></script>
<script src="assets/js/laptop/app.js?v=20261022170120"></script>
</body>
</html>
