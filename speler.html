<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hussel — meedoen</title>
<script>
  // Old QR codes and home-screen shortcuts point here with ?sessie=CODE:
  // pass them on to the renamed page with the new parameter name.
  (function () {
    'use strict';
    const params = new URLSearchParams(location.search);
    if (params.has('sessie')) {
      if (!params.has('session')) params.set('session', params.get('sessie'));
      params.delete('sessie');
    }
    const query = params.toString();
    location.replace('player.html' + (query ? '?' + query : '') + location.hash);
  })();
</script>
</head>
<body>
<p><a href="player.html">Hussel — meedoen</a></p>
</body>
</html>
