<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tests — hussel</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 2rem; }
  li.passed { color: #17603a; }
  li.failed { color: #a01b1b; }
</style>
</head>
<body>
<h1>Tests</h1>
<p id="summary"></p>
<ul id="results"></ul>
<script>
  const results = [];
  function test(name, fn) {
    try {
      fn();
      results.push({ name: name, passed: true });
    } catch (error) {
      results.push({ name: name, passed: false, error: error.message });
    }
  }
  function assert(condition, message) {
    if (!condition) throw new Error(message || 'assertion failed');
  }
  function assertEqual(actual, expected, message) {
    const a = JSON.stringify(actual);
    const b = JSON.stringify(expected);
    if (a !== b) throw new Error((message || 'not equal') + ': ' + a + ' !== ' + b);
  }
</script>
<script src="../assets/js/core/pairing.js?v=20261020224710"></script>
<script src="../assets/js/core/presets.js?v=20261020224710"></script>
<script src="../assets/js/core/session.js?v=20261020224710"></script>
<script src="../assets/js/core/migrate.js?v=20261020224710"></script>
<script src="../assets/js/core/store.js?v=20261020224710"></script>
<script src="tests.js?v=20261020224710"></script>
<script src="migrate-tests.js?v=20261020224710"></script>
<script>
  const list = document.getElementById('results');
  let failed = 0;
  for (const result of results) {
    const item = document.createElement('li');
    item.className = result.passed ? 'passed' : 'failed';
    item.textContent = result.name + (result.passed ? '' : ' — ' + result.error);
    if (!result.passed) failed += 1;
    list.appendChild(item);
  }
  document.getElementById('summary').textContent =
    (results.length - failed) + '/' + results.length + ' passed';
</script>
</body>
</html>
